server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so they can be pinned for as long as the browser likes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cached, or a deploy wouldn't be picked up until the cache expired.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The app is a single page: any path it knows how to render gets the shell,
  # including the dynamic ones (/threads/<id>) that can't be written as files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
